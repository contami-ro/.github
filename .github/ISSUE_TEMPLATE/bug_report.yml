name: Bug report
description: Something is broken or behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Logs, screenshots, or context
      description: Anything that helps — console output, request IDs, screenshots. Redact personal data before pasting.
    validations:
      required: false
